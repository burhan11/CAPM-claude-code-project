<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Travellers</title>
    <script>
        // Dev session guard: hide the app until the session is verified, else go to login
        document.documentElement.style.visibility = "hidden";
        fetch("/me", { credentials: "same-origin" }).then(function (r) {
            // only a 401 means "not signed in"; where /me does not exist (production, approuter login) pass through
            if (r.status === 401) { window.location.replace("login.html"); }
            else { document.documentElement.style.visibility = ""; }
        }).catch(function () { document.documentElement.style.visibility = ""; });
    </script>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.152.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "burhan.claude.travellers": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="burhan.claude.travellers"
        data-id="container"
        data-settings='{"id" : "burhan.claude.travellers"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
